services:
  nginx:
    image: nginx
    networks:
      - frontend
      - backend
    
    container_name: nginx
    
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    ports:
      - 8080:80

  frontend:
    build:
      context: ../frontend
    
    container_name: frontend

    environment:
      API_PORT: ${API_PORT}
      API_HOST: ${API_HOST}
    
    networks:
      - frontend
  
  api:
    build:
      context: ../api

    container_name: api

    environment:
      BACKEND_HOST: ${BACKEND_HOST}
    
    networks:
      - backend
  
  backend:
    build:
      context: ../backend

    container_name: backend
    
    environment:
      BACKEND_PORT: ${BACKEND_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
    
    depends_on:
      postgres:
        condition: service_healthy
    
    networks:
      - backend

  postgres:
    image:
      postgres:16

    container_name: postgres
    
    volumes:
    - postgres_data:/var/lib/postgresql/data

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 5
      timeout: 5s

    networks:
      - backend

networks:
  frontend:
  backend:

volumes:
  postgres_data: